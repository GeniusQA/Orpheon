# Builds and tests every push / pull request. The default APK artifact is an optimised Release
# build; the fixed "1.0.0" tag additionally gets a stable signed Release. Artifacts only: no GitHub
# Release, tag-derived versioning, release notes or announcements.
name: Android

on:
  push:
    branches: [master, main]
    tags: ["1.0.0"]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: base

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      # Unit tests of every module that has them: the Android modules (app, host-android) run
      # testDebugUnitTest, the JVM modules (extensions, api-spotify, host-cdp) run test.
      # The live tests in host-cdp skip themselves without a browser to drive.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :host-android:testDebugUnitTest :extensions:test :api-spotify:test :host-cdp:test

      - name: Test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            base/**/build/reports/tests/
            base/**/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

      # Default CI package is an optimised Release build signed with the debug key. It keeps the
      # Orpheon name; only the application id carries the dev suffix (as the old debug build did).
      - name: Release APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: ./gradlew :app:assembleRelease -PoverDev -Pabis=arm64-v8a -PappVersionName=1.0.0 -PappVersionCode=1

      - name: Name release APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          APK=$(find base/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name 'Orpheon-*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" base/app/build/outputs/apk/release/Orpheon-1.0.0-arm64-v8a.apk

      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: Orpheon-1.0.0-arm64-v8a
          path: base/app/build/outputs/apk/release/Orpheon-1.0.0-arm64-v8a.apk
          retention-days: 14
          if-no-files-found: error

  signed:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MYSPOTI_STABLE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::MYSPOTI_STABLE_KEYSTORE_BASE64 secret missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Signed APK
        env:
          MYSPOTI_KEYSTORE: ${{ runner.temp }}/release.jks
          MYSPOTI_KEYSTORE_PASSWORD: ${{ secrets.MYSPOTI_STABLE_KEYSTORE_PASSWORD }}
          MYSPOTI_KEY_ALIAS: ${{ secrets.MYSPOTI_STABLE_KEY_ALIAS }}
          MYSPOTI_KEY_PASSWORD: ${{ secrets.MYSPOTI_STABLE_KEY_PASSWORD }}
        run: |
          test "$GITHUB_REF_NAME" = "1.0.0"
          # Fixed version for this fork; artifacts only, no update repo or release metadata.
          # collectApks names: Orpheon-1.0.0-arm64-v8a.apk, -armeabi-v7a.apk, -universal.apk, -TV.apk.
          ./gradlew assembleRelease :app:collectApks \
            -PappVersionName=1.0.0 \
            -PappVersionCode=1

      - uses: actions/upload-artifact@v7
        with:
          name: orpheon-signed-1.0.0
          path: base/app/build/release-apks/*.apk
          retention-days: 14
